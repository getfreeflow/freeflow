name: FreeFlow
options:
  bundleIdPrefix: com.freeflow
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "1.1.0"

targets:
  FreeFlow:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Support/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    # CODE_SIGN_IDENTITY lives here rather than in `settings` below, because a
    # target-level build setting overrides an xcconfig and the whole point is to
    # let a local, untracked file win. See Support/Signing.xcconfig.
    configFiles:
      Debug: Support/Signing.xcconfig
      Release: Support/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: FreeFlow
        PRODUCT_BUNDLE_IDENTIFIER: com.freeflow.FreeFlow
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/FreeFlow.entitlements
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
