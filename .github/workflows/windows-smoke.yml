name: Windows smoke test

# Runs the speech pipeline and the keystroke plumbing on a real Windows machine and
# prints what they actually do, because a Mac can't tell you why whisper.cpp exited
# with 1, or that a tap of Right Alt sent the paste into a menu bar.

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/src/main/whisper.ts'
      - 'windows/src/main/inject.ts'
      - 'windows/src/main/foreground.ts'
      - 'windows/scripts/smoke-*'
      - '.github/workflows/windows-smoke.yml'

jobs:
  whisper:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install
        working-directory: windows
        run: npm ci

      - name: Build
        working-directory: windows
        run: npm run build

      - name: Speech pipeline
        working-directory: windows
        run: node scripts/smoke-whisper.mjs

      - name: Paste and foreground app
        working-directory: windows
        run: node scripts/smoke-keys.mjs
